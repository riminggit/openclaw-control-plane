version: '3.9'

services:
  backend:
    build: ./backend
    container_name: openclaw-backend
    ports:
      - '8080:8080'
    environment:
      - DATABASE_URL=sqlite:///./data/control_plane.db
      - APP_ENV=prod
      - CORS_ORIGINS=*
      - API_KEY=${API_KEY:-}
      - GATEWAY_URL=${GATEWAY_URL:-}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: openclaw-frontend
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-data:
    driver: local
